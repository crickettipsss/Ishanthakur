.profile-name{

.record{
margin-top:25px;

border:1px solid #1a3a61;
border-radius:20px;
background:#0b1b37;
text-align:center;
font-size:17px;
font-weight:900;
font-style:italic;
letter-spacing:4px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:28px;
}

.stat{
min-height:92px;
border:1px solid #152d4d;
border-radius:18px;

font-style:italic;
letter-spacing:2px;
text-align:center;
text-decoration:none;
box-shadow:0 0 17px #e9b63c55;
}

.disclaimer{

padding:18px;
border:1px solid #15243b;
border-radius:20px;
background:#030a15;
color:#7e8798;
font-size:12px;

.footer{
